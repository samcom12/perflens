[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "perflens"
version = "0.1.0"
description = "Automated HPC code optimization framework for C/C++/Fortran/Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Samir", github = "samcom12" }]
keywords = ["hpc", "performance", "optimization", "llm", "clang", "mpi", "openmp"]

dependencies = [
    "anthropic>=0.25.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "plotly>=5.22.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "jinja2>=3.1.4",
    "libclang>=16.0.0",
    "gitpython>=3.1.43",
    "psutil>=5.9.8",
    "fparser>=0.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "black>=24.4.2",
    "httpx>=0.27.0",
]

[project.scripts]
perflens = "perflens.cli:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=perflens --cov-report=term-missing"
